# =============================================================================
# Entity Resolution - main configuration
# =============================================================================
# Every path in this file is RELATIVE to the repository root by default, so a
# fresh clone runs without editing anything as long as the data lives in
# ./train and ./test.
#
# On the HPC (or anywhere the data lives elsewhere) you do NOT need to edit this
# file - override at runtime with environment variables instead:
#
#   export ER_DATA_ROOT=/scratch/challenge/data/train
#   export ER_TEST_DATA_ROOT=/scratch/challenge/data/test
#   export ER_WORK_DIR=/scratch/$USER/er_outputs
#
# Precedence: environment variable > config.yaml > built-in default.
# =============================================================================

project:
  name: entity-resolution
  seed: 42

paths:
  # Directory holding the training TSVs. The challenge dataset is NOT committed
  # to git; see .gitignore.
  data_root: "train"
  test_data_root: "test"

  # File names inside data_root / test_data_root.
  files:
    train:
      source1: "train_source1.tsv"
      source2: "train_source2.tsv"
      source3: "train_source3.tsv"
      ground_truth: "train_ground_truth.tsv"
    test:
      source1: "test_source1.tsv"
      source2: "test_source2.tsv"
      source3: "test_source3.tsv"

  # All generated artifacts. Safe to delete; regenerate with the scripts.
  work_dir: "outputs"
  prepared_dir: "outputs/prepared"
  index_dir: "outputs/indexes"
  candidates_dir: "outputs/candidates"
  log_dir: "logs"

# TSV column names. Change here (not in code) if the challenge renames columns.
columns:
  entity_id: "entity_id"
  name: "business_name"
  address: "business_address"
  country: "country"
  gt_source1_id: "source1_entity_id"
  gt_matched_ids: "matched_entity_ids"

io:
  # Rows per chunk when streaming the raw TSVs.
  # Peak RAM scales with chunksize, not with dataset size.
  chunksize: 500000
  # "tsv" always works. "parquet" is faster and smaller but needs pyarrow.
  prepared_format: "tsv"
  candidates_format: "tsv"
  # null | "gzip" | "bz2" | "zip"
  compression: null

# =============================================================================
# Compute policy
# =============================================================================
# The architecture is CPU-FIRST WITH AUTOMATIC GPU ACCELERATION - not CPU-only
# and not GPU-required. Every stage runs to completion on CPU; the stages that
# genuinely benefit from an accelerator resolve a device through
# src/utils.resolve_device_from_config() and take the GPU when one is present.
#
# Stages that consult this: embedding generation, dense retrieval / FAISS,
# batched embedding similarity, transformer / cross-encoder inference.
# Stages that deliberately do NOT (CPU was found faster): normalization, exact
# index build/lookup, candidate union, lexical string similarity, GBDT training.
# See README "Compute architecture" for the per-stage rationale.
# =============================================================================
compute:
  # auto   -> CUDA when torch is installed and a GPU is visible, else CPU
  # cpu    -> pin to CPU (GPU-less node, or reproducible benchmarking)
  # cuda   -> pin to the first GPU; fails loudly if none is visible
  # cuda:N -> pin to a specific GPU;  mps -> Apple silicon
  device: "auto"

  # Worker processes for the CPU-bound, shardable stages (prepare_data, feature
  # generation, pair statistics). 0 = auto: the PHYSICAL core count, clamped to
  # the number of chunks. Physical rather than logical because this work is python
  # string/token bound, so hyperthread siblings add contention; and because a
  # large HPC node should not be capped at 8. Set a number to pin it.
  num_workers: 0

  # ---- Consumed by the embedding / reranking stages when implemented ----
  # Left here as the intended knobs so those stages need no new config keys.
  # Batch size for GPU encoding and cross-encoder reranking; tune to fit VRAM.
  gpu_batch_size: 256
  # float16 halves VRAM and speeds up encoding for a negligible effect on
  # cosine ranking; float32 when exactness matters more than memory.
  embedding_dtype: "float16"
  # GPUs a multi-GPU stage may use; empty = every visible device. Only the
  # benchmark harness reads this today - no pipeline stage is GPU-bound.
  gpu_ids: []

  # ---- Consumed by scripts/analyze_blocking_statistics.py ----
  # RAM the queued worker payloads may occupy, in bytes. Empty = a quarter of
  # currently-available RAM. The per-pair chunks are reduced to fit, and the
  # adjustment is logged, so a big worker count cannot OOM the node.
  payload_budget_bytes: null

  # Shards for job-array execution of the candidate / inference stages.
  # 1 = single process. The candidate union is per-S1, so shards are independent
  # and merge by concatenation.
  shard_count: 1

normalization:
  # NFC | NFKC. NFKC folds compatibility forms (full-width, ligatures) which
  # helps matching; it preserves Indic scripts and their combining marks.
  unicode_form: "NFKC"
  # Fold diacritics on LATIN characters only (e.g. "Léarning" -> "learning").
  # Latin-only by design: NFD-stripping every script would delete the Devanagari
  # and Kannada combining marks that carry the actual phonetics.
  fold_latin_accents: true
  # lower | casefold. "lower" is the conservative default; "casefold" also maps
  # e.g. German "ß" -> "ss".
  case_mode: "lower"
  # Map punctuation and symbols to a space so they act as token boundaries.
  punctuation_to_space: true
  # Truncate absurdly long fields (some addresses/names are thousands of chars).
  max_length: 512

blocking:
  # Each blocker is a candidate generator. The final candidate set is the UNION
  # over all enabled blockers. Blocking only proposes pairs; it never decides
  # whether a pair is a match.
  #
  # The configuration below is the PROVISIONAL production blocker: the cell that was
  # measured end to end at pair recall 57.0123% / 336,056,756 candidates.
  #   exact(name_norm)  UNION  token(name_norm, df<=1000, rarest 1)
  #                            UNION  char(name_key, df<=1000, rarest 5, J>=0.3)
  # A DF=5000 / rarest-K=1 token variant is still an INDEPENDENT BACKGROUND
  # EXPERIMENT and is deliberately not wired in here.
  #
  # df_cap and rarest_k are not tuning knobs: changing them defines a different
  # blocker than the one that was calibrated. See README "Blocking".
  exact_name:
    enabled: true
    # Which normalized field to key on:
    #   name_norm -> "orelee s barbershop"   (token preserving)
    #   name_key  -> "oreleesbarbershop"     (all separators removed)
    key: "name_norm"

  token:
    enabled: true
    # name_norm, so the blocker sees the same token boundaries the corpus
    # statistics were counted over.
    key: "name_norm"
    # A token is eligible only when 0 < df <= df_cap over the TARGET corpus, and
    # each entity spends its rarest_k slots on its rarest eligible tokens.
    df_cap: 1000
    rarest_k: 1

  char_ngram:
    enabled: true
    # name_key, NOT name_norm: the char blocker's signal is defined on the
    # separator-free form, and forcing it onto name_norm would be a different
    # blocker than the one that was calibrated.
    key: "name_key"
    df_cap: 1000
    rarest_k: 5
    # Inclusive trigram Jaccard cut-off applied to every retrieved pair.
    jaccard: 0.3

  # ---- Dense multilingual retrieval (implemented; NOT yet calibrated) ----
  # bge-m3 embeddings of name_norm + FAISS inner-product search: each S1 keeps its
  # top_k nearest targets with cosine >= min_score. This is the generator for the
  # cross-script pairs (134,718 in train) no lexical blocker can reach.
  #
  # Disabled until the HPC recall x volume run picks top_k / min_score, the same
  # way the lexical cells were calibrated. To enable: fetch the model once on a
  # node with internet (python scripts/fetch_dense_model.py --output <dir>), set
  # model_name_or_path to <dir>, then either flip enabled or pass
  # --blockers exact_name,token,char_ngram,dense to build_indexes/generate_candidates.
  # Encoding ~12.6M names is the GPU stage of the pipeline (compute.device).
  dense:
    enabled: false
    key: "name_norm"
    model_name_or_path: "BAAI/bge-m3"  # a LOCAL directory in production
    backend: "sentence_transformers"
    local_files_only: true             # never reach the hub at runtime
    max_length: 64
    batch_size: 256
    device: "auto"                     # auto -> compute.device
    faiss_factory: "Flat"              # exact; e.g. "IVF16384,Flat" at full scale
    nprobe: 32                         # IVF factories only
    train_sample: 500000               # IVF training vectors
    top_k: 20
    # Recall-first: true cross-script pairs score ~0.67-0.84 (synthetic smoke test),
    # so 0.75 would drop most of them. Calibrate on the HPC recall x volume run.
    min_score: 0.60

  # ---- Roadmap ----
  tfidf:
    enabled: false

  # Safety valve: cap candidates per (S1, source). 0 = unlimited.
  max_candidates_per_source: 0

evaluation:
  split:
    # Validation MUST be split by S1 entity so that all pairs of one S1 land in
    # the same split. Splitting by pair would leak.
    enabled: true
    val_fraction: 0.2
    # hash -> deterministic by entity id (reproducible across runs/machines)
    # random -> seeded shuffle of the S1 list
    mode: "hash"

  # How to treat the 123,247 S1 entities whose ground truth is empty.
  #   "exclude"  -> macro-average over entities that have >=1 true match
  #   "score_zero" -> empty-GT entity scores 0 if we predicted anything, 1 if not
  # Both are always reported; this picks which one is labelled "primary".
  zero_match_policy: "exclude"

  # K values to evaluate once blocking is combined with ranked retrieval.
  # Do NOT assume K=50; these are measured against validation.
  k_values: [10, 25, 50, 100, 200]
